<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Document</title>
  </head>

  <body>
    <div>
      <h1>Chat App</h1>
      <div id="nameBlock">
        <input type="text" id="userName" placeholder="Please Enter Your Name" />
        <button id="joinButton">Join</button>
      </div>
      <ul id="messages"></ul>

      <form id="messageForm">
        <input id="inputMessage" value="" placeholder="Write a message" />
        <button id="sendButton">Send</button>
      </form>
    </div>
  </body>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const joinButton = document.getElementById("joinButton");

    const inputUserName = document.getElementById("userName");

    const form = document.getElementById("messageForm");

    const nameBlock = document.getElementById("nameBlock");

    form.style.display = "none";

    joinButton.addEventListener("click", () => {
      if (inputUserName.value) {
        socket.emit("join", (userName = inputUserName.value));
        form.style.display = "block";
        nameBlock.style.display = "none";
      }
    });

    const messages = document.getElementById("messages");

    const inputMessage = document.getElementById("inputMessage");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (inputMessage.value) {
        socket.emit("Chat", inputMessage.value);
        inputMessage.value = "";
      }
      console.log("message Submitted");
    });

    socket.on("join", (msg) => {
      const name = document.createElement("li");
      name.textContent = `${msg.userName} Joined`;
      messages.appendChild(name);
    });

    socket.on("Chat Message", (msg) => {
      const item = document.createElement("li");
      if (msg.id === socket.id) {
        item.textContent = `${msg.msg}`;
      } else {
        item.textContent = `${msg.userName} : ${msg.msg}`;
      }

      if (msg.id === socket.id) {
        item.style.background = "#69cabf";
        item.style.color = "white";
        item.style.marginLeft = "auto";
      }
      messages.appendChild(item);
    });
  </script>
</html>
